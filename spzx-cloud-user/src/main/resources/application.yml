# 配置服务端口号
server:
  port: 10100

# 配置数据库的连接信息
spring:
  application:
    name: spzx-cloud-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.146.131:3307/spzx-cloud-user?characterEncoding=UTF8
    username: root
    password: 1234
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.146.131:8848
# 配置mybatis的相关信息
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.atguigu.spzx.cloud.user.entity
  mapper-locations: classpath:/mapper/*.xml